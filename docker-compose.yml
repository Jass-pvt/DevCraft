services:
  mongo:
    image: mongo:7
    container_name: devcraft-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: devcraft-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - DATABASE_URL=mongodb://mongo:27017/devcraft
      - CORS_ORIGIN=http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: devcraft-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      - VITE_API_URL=http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
